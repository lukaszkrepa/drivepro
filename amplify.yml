version: 1
backend:
  phases:
    preBuild:
      commands:
        - npm install
        - cd amplify && npm install
    build:
      commands:
        - export CI=1
        - if [ "$AWS_BRANCH" = "dev" ]; then cd amplify && ../node_modules/.bin/ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --outputs-out-dir ..; else echo "Skipping backend deploy for branch $AWS_BRANCH"; fi
        - cd amplify && ../node_modules/.bin/ampx generate outputs --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --out-dir ..
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - amplify/node_modules/**/*
      - frontend/node_modules/**/*

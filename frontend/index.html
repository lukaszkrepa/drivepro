<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
        var deviceCssW = Math.min(screen.width, screen.height);
        var desktopLayout = window.innerWidth >= 970;
        if (isTouch && desktopLayout && deviceCssW <= 480) {
          document.documentElement.classList.add('force-mobile');
        }
      })();
    </script>
    <title>DRIVE PRO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
